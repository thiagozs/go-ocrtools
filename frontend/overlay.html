<!doctype html>
<html><head><meta charset="UTF-8"><title>Selecionar área</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;cursor:crosshair;user-select:none}
#shot{position:fixed;inset:0;width:100vw;height:100vh;object-fit:fill;pointer-events:none}
#dim{position:fixed;inset:0;background:rgba(0,0,0,.45);pointer-events:none}
#sel{position:fixed;display:none;border:2px solid #4da3ff;box-shadow:0 0 0 9999px rgba(0,0,0,.45);pointer-events:none}
#hint{position:fixed;top:14px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.75);color:#fff;font:13px system-ui;pointer-events:none}
</style></head>
<body>
<img id="shot" alt=""><div id="dim"></div><div id="sel"></div>
<div id="hint">Arraste para selecionar a área · Esc cancela</div>
<script type="module" src="/src/overlay.js"></script>
</body></html>
